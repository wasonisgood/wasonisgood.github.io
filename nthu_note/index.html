<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>清大共筆 · NTHU Notes</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="rd-app" id="app" data-mode="double">
    <!-- 頂部書櫥工具列 -->
    <header class="rd-bar" id="rd-bar"></header>

    <!-- 主體三欄區域 -->
    <div class="rd-body">
      <!-- 左側章節目錄抽屜 -->
      <nav class="rd-nav" id="rd-nav"></nav>

      <!-- 中央舞台閱讀 / 編輯區 -->
      <main class="rd-stage" id="rd-stage"></main>

      <!-- 右側筆記側欄抽屜 -->
      <aside class="rd-side" id="rd-side"></aside>
    </div>

    <!-- 選取文字浮動工具條 -->
    <div class="rd-select-popover" id="rd-popover">
      <button class="rd-select-btn" id="btn-pop-note"><span>📌</span> 記至共筆</button>
      <button class="rd-select-btn" id="btn-pop-copy"><span>📋</span> 複製引文</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
