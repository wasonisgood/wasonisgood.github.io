<title>失落的旋律 · 已搬家</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E2326;color:#EAF2EF;font:16px/1.6 system-ui,"Noto Sans TC",sans-serif;text-align:center;padding:24px}a{color:#EDB64E}</style>

<body>
<p>「失落的旋律」已搬到新網址,正在為你轉址…<br><a href="https://wasonsign.web.app/solfege/">如果沒有自動跳轉,請點這裡</a></p>
<script>
(async function(){
  var target='https://wasonsign.web.app/solfege/';
  try{
    if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister()}))}
    if('caches' in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}
  }catch(e){}
  location.replace(target);
})();
</script>
</body>
